[package]
name = "concierge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Crypto/SubtleCrypto/CryptoKey: RS256 verification of the Cloudflare Access
# JWT. ReadableStream/Response went with the inbound email handler, which read
# the raw message off a stream.
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey"] }
urlencoding = "2"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
subtle = "2.6"

# Locale resolution only: unic-langid for BCP-47 tag handling,
# accept-language for parsing the request header.
#
# icu4x, fixed_decimal, rusty-money and fluent are gone with the server-side
# templates. Number, currency and date formatting is the frontend's job now
# (Intl.NumberFormat gives the same INR lakh grouping from the browser's own
# locale data), and UI copy lives in the Elm app rather than in FTL files.
unic-langid = { version = "0.9", features = ["macros"] }
accept-language = "3"

[profile.release]
opt-level = "s"
lto = true
