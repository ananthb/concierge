[package]
name = "replybots"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.9", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
urlencoding = "2"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
subtle = "2.6"

# Locale resolution only: unic-langid for BCP-47 tag handling,
# accept-language for parsing the request header.
unic-langid = { version = "0.9", features = ["macros"] }
accept-language = "3"

# Used only by build.rs, to generate the Subresource Integrity hashes the
# shell embeds for every stylesheet and both scripts.
[build-dependencies]
sha2 = "0.11"
base64 = "0.23"

[profile.release]
opt-level = "s"
lto = true
