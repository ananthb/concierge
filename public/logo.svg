<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Antenna -->
  <line x1="16" y1="5" x2="16" y2="9" stroke="#111111" stroke-width="2"/>
  <rect x="14" y="2" width="4" height="3.5" fill="#F59E0B" stroke="#111111" stroke-width="1.5"/>
  <!-- Robot / Envelope body -->
  <rect x="3" y="9" width="26" height="19" fill="#FFFFFF"/>
  <!-- Cobalt visor band -->
  <rect x="3" y="9" width="26" height="8" fill="#2563EB"/>
  <!-- Robot eyes -->
  <rect x="8.5" y="11" width="4" height="4" fill="#FEF3C7"/>
  <rect x="19.5" y="11" width="4" height="4" fill="#FEF3C7"/>
  <!-- Visor divider -->
  <line x1="3" y1="17" x2="29" y2="17" stroke="#111111" stroke-width="1.75"/>
  <!-- Envelope V-flap -->
  <polygon points="3,17 29,17 16,25" fill="#FEF3C7" stroke="#111111" stroke-width="1.75" stroke-linejoin="miter"/>
  <!-- Emerald seal / status detail -->
  <rect x="14.5" y="23.5" width="3" height="3" fill="#059669"/>
  <!-- Outer structural border -->
  <rect x="3" y="9" width="26" height="19" fill="none" stroke="#111111" stroke-width="2"/>
</svg>
