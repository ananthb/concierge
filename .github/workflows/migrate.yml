name: Migrate D1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: |
          npx wrangler d1 migrations apply replybots --remote
          sed 's/\[\[previews\.d1_databases\]\]/[[d1_databases]]/' wrangler.toml > wrangler.preview-migrate.toml
          npx wrangler d1 migrations apply replybots-preview --remote --config wrangler.preview-migrate.toml
          rm -f wrangler.preview-migrate.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
