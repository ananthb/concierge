name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # build.rs hashes public/app.js for the shell's integrity attributes, so
      # the frontend has to exist before the crate will compile at all --
      # including a docs build, which never reaches rustdoc without it. elm
      # comes from the devShell, so no npm install is needed here.
      - name: Build frontend (required by build.rs)
        run: nix develop -c ./scripts/build-frontend.sh

      - name: Build API documentation
        run: nix develop -c cargo doc --no-deps

      - name: Assemble site
        run: |
          mkdir -p site
          # Copy every static asset under doc/, not just the HTML — docs.css
          # (and any future image/JS) needs to ride along.
          cp -r doc/. site/
          mv target/doc site/api

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
