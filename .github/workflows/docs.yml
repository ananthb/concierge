name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - 'scripts/generate-docs-ref.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs"
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # build.rs hashes public/app.js for the shell's integrity attributes, so
      # the frontend has to exist before the crate will compile at all —
      # including a docs build, which never reaches rustdoc without it. elm
      # comes from the devShell, so no npm install is needed here.
      - name: Build frontend (required by build.rs)
        run: nix develop --command ./scripts/build-frontend.sh

      - name: Generate reference docs & build mdBook
        run: |
          nix develop --command node scripts/generate-docs-ref.mjs
          nix develop --command mdbook build docs

      - name: Build API documentation
        run: nix develop --command cargo doc --no-deps

      - name: Assemble API docs into mdBook output
        run: |
          rm -rf docs/book/api
          mv target/doc docs/book/api

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/book --project-name=replybots-docs
