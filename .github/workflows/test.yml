name: Test

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'README.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

# Least-privilege default. The playwright job only reads the repo.
permissions:
  contents: read

# Cancel in-flight runs on the same ref when a newer commit arrives;
# never cancel main (push) runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright (browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Nix gets us pinned versions of Rust + worker-build + wrangler so
      # the wasm build behaves identically to the local devShell.
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Run Playwright tests
        run: nix develop --command npm test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  cargo:
    name: Cargo (fmt, test, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same nix devShell the playwright job uses, so the toolchain that
      # runs the tests is the one pinned in flake.lock.
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Separate key from the playwright job: that one fills target/ with
      # worker-build's wasm artifacts, this one with host-target test
      # binaries. Sharing a key would have them evict each other.
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-checks-${{ runner.os }}-

      - name: cargo fmt
        run: nix develop --command cargo fmt --check

      # Unit tests run on the host target. Anything touching js-sys (the
      # `now_iso` helper, every worker binding) panics there with "cannot
      # call wasm-bindgen imported functions on non-wasm targets", so the
      # suite covers pure logic: parsers, prompt assembly, templates,
      # wire-format round-trips.
      - name: cargo test
        run: nix develop --command cargo test --lib

      # Not gating yet: main carries 70 clippy warnings, none of them
      # bugs (mostly needless to_string, too_many_arguments on the big
      # handler signatures). Clearing them and flipping this to
      # `-- -D warnings` is its own change; until then the step keeps the
      # count visible in the log.
      - name: cargo clippy
        run: nix develop --command cargo clippy --target wasm32-unknown-unknown --all-targets
