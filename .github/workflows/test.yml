name: Test

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'README.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

# Least-privilege default. The playwright job only reads the repo.
permissions:
  contents: read

# Cancel in-flight runs on the same ref when a newer commit arrives;
# never cancel main (push) runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Elm (format, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # elm resolves its package registry over the network, which a nix
      # sandbox doesn't have — so the build runs here rather than as a flake
      # check. `elm-stuff` is the resolved-package cache.
      - name: Cache elm packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.elm
            frontend/elm-stuff
          key: elm-${{ runner.os }}-${{ hashFiles('frontend/elm.json') }}
          restore-keys: elm-${{ runner.os }}-

      - name: elm-format
        run: nix develop --command elm-format --validate frontend/src

      # --optimize is the gate that matters: it refuses any Debug.* call, so
      # a stray Debug.log can't reach production.
      - name: Build frontend
        run: nix develop --command ./scripts/build-frontend.sh

      - name: elm-test
        run: nix develop --command bash -c 'cd frontend && elm-test'

  playwright:
    name: Playwright (browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Nix gets us pinned versions of Rust + worker-build + wrangler so
      # the wasm build behaves identically to the local devShell.
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install npm dependencies
        run: nix develop --command npm ci

      # The prerendered marketing pages are committed, because Cloudflare Builds
      # has no browser and cannot generate them at deploy time. Regenerate and
      # diff: editing Elm copy without re-running `npm run prerender` would
      # otherwise serve stale HTML to crawlers indefinitely, with the live app
      # showing the new copy and nothing failing.
      - name: Check the prerendered pages are current
        run: |
          nix develop --command npm run build:frontend
          nix develop --command npm run prerender
          if ! git diff --quiet -- public/; then
            echo "::error::Prerendered pages are stale. Run 'npm run prerender' and commit public/*.html."
            git diff --stat -- public/
            exit 1
          fi
        env:
          CI: 'true'

      - name: Run Playwright tests
        run: nix develop --command npm test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  cargo:
    name: Cargo (fmt, test, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same nix devShell the playwright job uses, so the toolchain that
      # runs the tests is the one pinned in flake.lock.
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Separate key from the playwright job: that one fills target/ with
      # worker-build's wasm artifacts, this one with host-target test
      # binaries. Sharing a key would have them evict each other.
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-checks-${{ runner.os }}-

      # build.rs hashes public/app.js for the shell's integrity attributes, so
      # the frontend has to exist before the crate will compile. The deploy
      # path gets this from scripts/build-worker.sh; here it's explicit.
      - name: Build frontend (required by build.rs)
        run: nix develop --command npm ci && nix develop --command npm run build:frontend

      - name: cargo fmt
        run: nix develop --command cargo fmt --check

      # Unit tests run on the host target. Anything touching js-sys (the
      # `now_iso` helper, every worker binding) panics there with "cannot
      # call wasm-bindgen imported functions on non-wasm targets", so the
      # suite covers pure logic: parsers, prompt assembly, the risk gate,
      # wire-format round-trips.
      - name: cargo test
        run: nix develop --command cargo test --lib

      # Gating. Every warning main used to carry is cleared, so a new one
      # fails the build rather than joining a backlog nobody reads.
      # Deliberate exceptions are `#[allow]`d at the item with a comment
      # saying why, which keeps them reviewable in the diff.
      - name: cargo clippy
        run: nix develop --command cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
