name = "concierge"
main = "worker-shim.mjs"
compatibility_date = "2024-01-01"

[build]
# Wraps `worker-build --release` with a rustup + cargo bootstrap
# for envs without a Rust toolchain on PATH (e.g. Cloudflare Workers
# Builds, which runs `wrangler versions upload` directly without
# going through the `npm run deploy` script).
command = "./scripts/build-worker.sh"

# ============================================================================
# D1 Database for messages and submissions.
# The Deploy-to-Cloudflare button provisions a fresh D1 and rewrites
# `database_id` for the fork. For local `wrangler deploy`, replace the ID
# with one from `wrangler d1 create`.
# ============================================================================
# ============================================================================
# Static assets served directly by Cloudflare's edge: the compiled Elm
# bundle (app.js) and the CSS modules. Requests whose path matches a file
# under public/ are returned without invoking the Worker.
#
# There is deliberately no index.html here. The Worker renders the SPA shell
# itself (src/shell.rs) for every app route, so the per-response CSP nonce
# can be stamped into it and there's one code path that produces the page.
# ============================================================================
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "concierge"
database_id = "95687fdd-d529-4993-8b84-e55db87159c2"

# ============================================================================
# KV Namespace for configs. The Deploy button provisions and binds `id`.
# ============================================================================
[[kv_namespaces]]
binding = "KV"

# ============================================================================
# Durable Objects:
#   REPLY_BUFFER  — buffers inbound messages so we can reply to a batch.
#
# ApprovalsDO (per-tenant SSE fan-out for the approvals page) was deleted
# along with the approval queue. The v3 migration below tells Cloudflare to
# drop the class; removing the binding alone would leave the class orphaned
# and the deploy would be rejected.
# ============================================================================
[[durable_objects.bindings]]
name = "REPLY_BUFFER"
class_name = "ReplyBufferDO"

[[migrations]]
tag = "v1"
new_classes = ["ReplyBufferDO"]

[[migrations]]
tag = "v2"
new_classes = ["ApprovalsDO"]

[[migrations]]
tag = "v3"
deleted_classes = ["ApprovalsDO"]

# ============================================================================
# AI Binding for auto-reply generation
# ============================================================================
[ai]
binding = "AI"

# ============================================================================
# Queues: persona safety classifier
#
# Producer: PUT /api/persona and PUT /api/wizard/persona enqueue a SafetyJob
# whenever a tenant's composed prompt changes; PUT /api/manage/archetypes does
# the same for a catalog row.
#
# Consumer: src/safety_queue.rs:handle_batch (wired via #[event(queue)] in
# src/lib.rs) re-reads the persona, runs the classifier, and writes the
# verdict back. Failed jobs go to the DLQ after 3 retries.
#
# The Deploy button creates both queues. For local `wrangler deploy`, run:
#   wrangler queues create concierge-safety
#   wrangler queues create concierge-safety-dlq
# ============================================================================
[[queues.producers]]
queue = "concierge-safety"
binding = "SAFETY_QUEUE"

[[queues.consumers]]
queue = "concierge-safety"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "concierge-safety-dlq"

# ============================================================================
# Outbound email: used only to page a tenant when a conversation is handed
# off to a human. Inbound Email Routing (the `email` handler and the
# name@cncg.email addresses) was cut with the email channel, so no MX or
# routing rules are needed any more — just the send binding.
# ============================================================================
[[send_email]]
name = "EMAIL"

[vars]
ENVIRONMENT = "production"

# These are injected at deploy time from build environment variables of the
# same name (see `npm run deploy` in package.json). Set them once in
# Workers → Settings → Builds → Build environment variables:
#   CF_ACCESS_TEAM             Cloudflare Access team name
#   CF_ACCESS_AUD              Cloudflare Access application AUD tag
#   PUBLIC_BASE_URL            Primary site URL, e.g. https://concierge.example.com
#   EMAIL_DOMAIN               Domain outbound handoff emails are sent from
#                              (no MX needed — nothing is received here)
#   WHATSAPP_WABA_ID           Your WhatsApp Business Account ID
#   WHATSAPP_SIGNUP_CONFIG_ID  Meta Embedded Signup config ID

# ============================================================================
# Cron triggers:
#   "0 * * * *" — hourly tick: re-roll demo personas when the operator
#                 cadence has elapsed.
#
# The 15-minute approval-digest sweep went with the approval queue, and the
# daily Instagram token refresh with the Instagram channel. Mirror this list
# in src/scheduled.rs, which dispatches on event.cron().
# ============================================================================
[triggers]
crons = ["0 * * * *"]

[observability.logs]
enabled = true
invocation_logs = true

# ============================================================================
# Secrets the worker reads (set via `wrangler secret put`):
#   GOOGLE_OAUTH_CLIENT_ID     Google OAuth client ID
#   GOOGLE_OAUTH_CLIENT_SECRET Google OAuth client secret
#   WHATSAPP_ACCESS_TOKEN      System user token for the shared WABA
#   WHATSAPP_VERIFY_TOKEN      WhatsApp webhook verification token
#   META_APP_ID                Meta app ID (WhatsApp Embedded Signup)
#   META_APP_SECRET            Meta app secret
#   RAZORPAY_KEY_ID            Razorpay key ID
#   RAZORPAY_KEY_SECRET        Razorpay key secret
#   RAZORPAY_WEBHOOK_SECRET    Razorpay webhook secret
#
# No longer read: ENCRYPTION_KEY (sealed per-tenant Instagram tokens),
# INSTAGRAM_VERIFY_TOKEN, and DISCORD_{PUBLIC_KEY,APPLICATION_ID,BOT_TOKEN}.
# Delete them with `wrangler secret delete` once this is deployed.
# ============================================================================
# Optional overrides (defaults baked into the worker):
#   AI_MODEL                   Workers AI reply model (default llama-4-scout-17b-16e-instruct)
#   AI_FAST_MODEL              Workers AI scanning model (default llama-3.1-8b-instruct-fast)
# ============================================================================
