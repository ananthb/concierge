name = "replybots"
main = "build/index.js"
compatibility_date = "2024-01-01"

[build]
# Wraps `worker-build --release` with a rustup + cargo bootstrap
# for envs without a Rust toolchain on PATH (e.g. Cloudflare Workers
# Builds, which runs `wrangler versions upload` directly without
# going through the `npm run deploy` script).
command = "./scripts/build-worker.sh"

# ============================================================================
# Static assets served directly by Cloudflare's edge: the Elm bundle
# (app.js), its initialiser (boot.js), the CSS modules, and the prerendered
# marketing pages (index.html, pricing.html, features.html, terms.html,
# privacy.html — generated by `npm run prerender` and committed).
#
# A request matching a file here is answered from the edge and **the Worker
# is not invoked at all**.
#
# `not_found_handling` is left at its default ("none") so an unmatched path
# still reaches the Worker, which serves the shell for /wizard, /dashboard/*
# and a 404 for anything else.
# ============================================================================
[assets]
directory = "./public"

# ============================================================================
# D1 Database for all persistent state: tenants, sessions, onboarding,
# WhatsApp accounts, conversation state, burst buffer, rate limits,
# message metadata, payments, and billing.
# ============================================================================
[[d1_databases]]
binding = "DB"
database_name = "replybots"
# Note: Forgejo PR #845 recreates the production D1 database under `replybots`.
database_id = "95687fdd-d529-4993-8b84-e55db87159c2"

# ============================================================================
# AI Binding for auto-reply generation, injection detection, and safety checks.
# ============================================================================
[ai]
binding = "AI"

# ============================================================================
# Outbound email notifications (platform-to-tenant handoff alerts only).
# ============================================================================
[[send_email]]
name = "EMAIL"

[vars]
ENVIRONMENT = "production"

# These are injected at deploy time from build environment variables:
#   PUBLIC_BASE_URL            Primary site URL, e.g. https://replybots.io
#   EMAIL_DOMAIN               Domain outbound handoff emails are sent from, e.g. replybots.io
#                              (optional — no MX needed, nothing received here)
#   WHATSAPP_WABA_ID           Fallback WhatsApp Business Account ID
#   WHATSAPP_SIGNUP_CONFIG_ID  Meta Embedded Signup config ID

[observability.logs]
enabled = true
invocation_logs = true

# ============================================================================
# Secrets the worker reads (set via `wrangler secret put`):
#   WHATSAPP_ACCESS_TOKEN      System user token for WhatsApp Graph API calls
#   WHATSAPP_VERIFY_TOKEN      WhatsApp webhook verification token
#   META_APP_ID                Meta app ID (WhatsApp Embedded Signup)
#   META_APP_SECRET            Meta app secret
#   RAZORPAY_KEY_ID            Razorpay key ID
#   RAZORPAY_KEY_SECRET        Razorpay key secret
#   RAZORPAY_WEBHOOK_SECRET    Razorpay webhook secret
# ============================================================================
# Optional overrides (defaults baked into the worker):
#   AI_MODEL                   Workers AI reply model (default @cf/meta/llama-4-scout-17b-16e-instruct)
#   AI_INJECTION_MODEL         Workers AI injection classifier (default @cf/meta/prompt-guard-2-86m)
#   AI_SAFETY_MODEL            Workers AI safety classifier (default @cf/meta/llama-guard-3-8b)
#   DEV_MODE                   Set to "1" or "true" in local dev to stub AI/safety & enable /auth/dev-login
# ============================================================================
